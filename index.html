<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A simple To Do list website !</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="toggle-div" class="flex">
        <button id="theme">Light</button>
    </div>

    <h1> A simple To-Do list for daily life tasks.</h1>
    <div id="outer-box" class="flex">
        <!-- <iframe src="https://lottie.host/embed/9cf55170-ecb6-473f-8cb0-7fd427c6eeb8/qKImITYMLU.lottie"></iframe> -->
        <div id="first-animation">
    </div>
        
    <div id="inner-box" class="flex">
            <div id="tasks" class="flex">
                <div id="display-input" class="flex">
                    <input type="text" placeholder="Add some daily life tasks" id="task-input">
                    <button id="adding">Add</button>
                </div>

                <div id="display-output">
                
                </div>
            </div>
        </div>


    <script src="script.js"></script>
</body>

</html>
